services:
  nestjs_carvalima_app:
    container_name: nestjs_carvalima_app # Optional
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mongo_chat_history:
        condition: service_healthy
    networks:
      - event_net
    restart: unless-stopped

  mongo_chat_history:
    image: mongo:6
    container_name: mongo_chat
    ports:
      - "27017:27017"
    volumes:
      - mongo_chat_history:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - event_net
    restart: unless-stopped

networks:
  event_net:
    driver: bridge

volumes:
  mongo_chat_history:
    driver: local
